apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helm.fullname" . }}-mongodb
  labels:
    app: konexa-mongodb
spec:
  serviceName: {{ include "helm.fullname" . }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: konexa-mongodb
  template:
    metadata:
      labels:
        app: konexa-mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: "{{ .Values.mongodb.database }}"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
