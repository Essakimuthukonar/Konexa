apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-service
  labels:
    app: konexa
spec:
  type: {{ .Values.service.type }}
  selector:
    app: konexa
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
